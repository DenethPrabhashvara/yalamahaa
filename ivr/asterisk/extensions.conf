[general]
static=yes
writeprotect=yes

; Nothing else is reachable
[default]

[from-pbxim]
exten => _.,1,NoOp(Yala Maha IVR: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(TIMEOUT(absolute)=600)
 same => n,AGI(agi://127.0.0.1:4573)
 same => n,Hangup()
; explicit h so the _. pattern doesn't rerun the IVR on hangup
exten => h,1,NoOp(hangup)
